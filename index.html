<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARK</title>
    
    <!-- Ícono para el celular -->
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <!-- Configuración para que se abra pantalla completa como una App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZARK">
    
    <!-- Tu archivo CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- El Header -->
    <header class="header">
        <h1 class="logo">ZARK</h1>
        <!-- Ícono del menú hamburguesa -->
        <span class="material-symbols-outlined menu-btn">menu</span>
    </header>

    <!-- La cuadrícula de opciones -->
    <main class="contenedor-principal">
        <nav class="grid-cuadrados">
            
            <!-- Cuadrado 1: Moneda -->
            <a href="pages/moneda.html" class="cuadrado">
                <span class="material-symbols-outlined icono">toll</span>
                <span class="texto">Moneda</span>
            </a>

            <!-- Cuadrado 2: Ruleta -->
            <a href="pages/ruleta.html" class="cuadrado">
                <span class="material-symbols-outlined icono">casino</span>
                <span class="texto">Ruleta</span>
            </a>

            <!-- Cuadrado 3: Gastos -->
            <a href="pages/gastos.html" class="cuadrado">
                <span class="material-symbols-outlined icono">account_balance_wallet</span>
                <span class="texto">Gastos</span>
            </a>

        </nav>
    </main>

</body>
</html>
