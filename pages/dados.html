<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados 3D</title>
    
    <link rel="apple-touch-icon" href="../img/ZARK.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZARK">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header header-secundario">
        <a href="../index.html" class="material-symbols-outlined btn-volver">arrow_back</a>
        <h1 class="logo">Dado 3D</h1>
    </header>

    <main class="contenedor-principal text-center">
        
        <!-- La lona donde rebota -->
        <div class="arena-dados" id="arena">
            
            <!-- El contenedor que se mueve en X e Y -->
            <div id="movedor-dado">
                <!-- El espacio 3D que permite ver la profundidad -->
                <div class="escena-3d">
                    <!-- El dado físico que rota -->
                    <div class="cubo" id="dado-3d">
                        <div class="cara cara-1">1</div>
                        <div class="cara cara-2">2</div>
                        <div class="cara cara-3">3</div>
                        <div class="cara cara-4">4</div>
                        <div class="cara cara-5">5</div>
                        <div class="cara cara-6">6</div>
                    </div>
                </div>
            </div>

        </div>

        <button id="btn-tirar" class="btn-accion mt-20">Tirar dado</button>
        <p id="resultado-dado" class="mensaje-estado"></p>

    </main>

    <script src="../js/dados.js"></script>
</body>
</html>
